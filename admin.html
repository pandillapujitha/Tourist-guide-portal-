
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>View Bookings</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f2f2f2;
    margin:0;
    padding:20px;
}

h2{
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#007BFF;
    color:white;
}

tr:nth-child(even){
    background:#f9f9f9;
}

</style>
</head>
<body>

<h2>Tour Booking Details</h2>

<table>

<thead>

<tr>
<th>Name</th>
<th>Email</th>
<th>Phone</th>
<th>Place</th>
<th>Date</th>
</tr>

</thead>

<tbody id="bookingTable">

</tbody>

</table>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC5FxjC0bUuJFz_T4Q4KzZnEOXtzaTElJE",
authDomain: "cloud-computing-project-596be.firebaseapp.com",
projectId: "cloud-computing-project-596be",
storageBucket: "cloud-computing-project-596be.appspot.com",
messagingSenderId: "959671235175",
appId: "1:959671235175:web:f6420aade96ce496961ac2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const table = document.getElementById("bookingTable");

async function loadBookings(){

const querySnapshot = await getDocs(collection(db,"bookings"));

querySnapshot.forEach((doc)=>{

const data = doc.data();

table.innerHTML += `
<tr>
<td>${data.name}</td>
<td>${data.email}</td>
<td>${data.phone}</td>
<td>${data.place}</td>
<td>${data.date}</td>
</tr>
`;

});

}

loadBookings();

</script>

</body>
</html>
