
<!DOCTYPE html>
<html>
<head>
    <title>Tour Booking</title>
</head>
<body>

<h2>Tour Booking Form</h2>

<form onsubmit="return bookTour()">
    <input type="text" id="name" placeholder="Your Name" required><br><br>

    <input type="email" id="email" placeholder="Email" required><br><br>

    <input type="text" id="place" placeholder="Destination" required><br><br>

    <input type="number" id="persons" placeholder="Number of Persons" required><br><br>

    <button type="submit">Pay & Book</button>
</form>

<script src="script.js"></script>

</body>
</html>
